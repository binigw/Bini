        traceId: { type: string }
        isSimulation: { type: boolean }
        telemetrySource: { type: string }
        current: { type: number, nullable: true }
        thd: { type: number, nullable: true }
        db: { type: number, nullable: true }
        frequency: { type: number, nullable: true }
        phaseCurrentsA:
          type: array
          nullable: true
          items: { type: number }
        phaseVoltagesV:
          type: array
          nullable: true
          items: { type: number }
        rawWaveform:
          type: array
          nullable: true
          items: { type: number }
        safetyTriggers:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisSafetyTrigger"
        finalDecision: { type: string, nullable: true }
        faultConfidence: { type: number, nullable: true }
        ifAnomalyScore: { type: number, nullable: true }
        anomalyDetected: { type: boolean }
        healthScore: { type: number, nullable: true }
        severity: { type: string, nullable: true }
        status: { type: string, nullable: true }
        emergencyTrip: { type: boolean }
        overrideFault: { type: boolean }
        overrideReason: { type: string }
        rfTopClass: { type: string, nullable: true }
        xgbTopClass: { type: string, nullable: true }
        modelsAgreed: { type: boolean, nullable: true }
        measurementMode:
          type: string
          enum: [raw_waveform, scalar_electrical]
      required:
        - id
        - motorId
        - motorName
        - timestamp
        - traceId
        - isSimulation
        - telemetrySource
        - current
        - thd
        - db
        - frequency
        - phaseCurrentsA
        - phaseVoltagesV
        - rawWaveform
        - safetyTriggers
        - finalDecision
        - faultConfidence
        - ifAnomalyScore
        - anomalyDetected
        - healthScore
        - severity
        - status
        - emergencyTrip
        - overrideFault
        - overrideReason
        - rfTopClass
        - xgbTopClass
        - modelsAgreed
        - measurementMode

